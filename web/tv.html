<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOTAAITE - TV</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="tv">
<div class="screen">
  <div class="tv-stage">
    <video id="video" playsinline autoplay muted></video>
    <div class="overlay hidden" id="overlay">
      <div class="big-play" id="overlayText">Tap to start video</div>
    </div>
  </div>
</div>
<script src="vendor/hls.min.js"></script>
<script src="app.js"></script>
<script>
(function () {
  "use strict";
  var video = document.getElementById("video");
  var overlay = document.getElementById("overlay");
  var overlayText = document.getElementById("overlayText");
  var bufferMs = 6000;
  var player = null;
  var started = false;
  var combined = false;

  function showOverlay(text) {
    overlayText.textContent = text;
    overlay.classList.remove("hidden");
  }

  function hideOverlay() {
    overlay.classList.add("hidden");
  }

  function start() {
    if (started) return;
    started = true;
    hideOverlay();
    if (combined) video.muted = false;
    video.play().catch(function () {
      started = false;
      showOverlay(combined ? "Tap to start video and sound" : "Tap to start video");
    });
  }

  function onStatus(s) {
    if (s.needsGesture) {
      showOverlay(combined ? "Tap to start video and sound" : "Tap to start video");
    } else if (s.error) {
      showOverlay("Error: " + s.error);
    }
  }

  document.body.addEventListener("click", start);

  (async function () {
    var cfg = await window.VOTAAITE.fetchConfig();
    combined = cfg.mode === "combined";
    bufferMs = (cfg.hlsTime || 2) * 3 * 1000;
    video.muted = true;
    player = new window.VOTAAITE.SyncPlayer(video, cfg.video, {
      hlsTime: cfg.hlsTime,
      bufferMs: bufferMs,
      forceNative: new URLSearchParams(location.search).get("native") === "1",
      onStatus: onStatus,
    });
    await player.load();
    setInterval(function () {
      var lat = player.latencySeconds();
      if (lat != null) {
        fetch("api/report?role=tv&lat=" + lat, { cache: "no-store" }).catch(function () {});
      }
    }, 1000);
    if (combined) {
      showOverlay("Tap to turn on sound");
    } else {
      setTimeout(function () {
        if (video.paused) showOverlay("Tap to start video");
      }, 1500);
    }
  })();
})();
</script>
</body>
</html>
